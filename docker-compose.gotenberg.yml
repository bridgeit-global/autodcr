# Free self-hosted LibreOffice-based DOCX→PDF (Gotenberg bundles LibreOffice).
# Run: docker compose -f docker-compose.gotenberg.yml up -d
# Then expose port 3001 publicly (ngrok or deploy same image to Railway/Fly/Render).
# Vercel env:
#   DOCX_CONVERTER_URL=https://YOUR_PUBLIC_HOST/forms/libreoffice/convert
#   DOCX_CONVERTER_MODE=gotenberg

services:
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3001:3000"
